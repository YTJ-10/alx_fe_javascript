<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Quote Generator</title>
</head>
<body>
    <h1>Dynamic Quote Generator</h1>
    
    <!-- Category Filter -->
    <div id="filterSection">
        <label for="categoryFilter">Filter by Category:</label>
        <select id="categoryFilter">
            <option value="all">All Categories</option>
            <!-- Dynamically populated categories -->
        </select>
    </div>
    
    <div id="quoteDisplay"></div>
    <button id="newQuote">Show New Random Quote</button>
    
    <!-- Data Management Section -->
    <div id="dataControls">
        <h3>Data Management</h3>
        <button onclick="exportToJson()">Export Quotes to JSON</button>
        <div class="import-section">
            <label for="importFile">Import Quotes from JSON:</label>
            <input type="file" id="importFile" accept=".json" />
            <button onclick="importFromJson()">Import Quotes</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
